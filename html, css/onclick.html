<!doctype html>
<html>
    <head>
        <title>Full JavaScript Teaching Example</title>

        <style>
            body {
                font-family: Arial;
                background-color: #f2f2f2;
                text-align: center;
            }

            .box {
                background-color: white;
                width: 600px;
                margin: 30px auto;
                padding: 20px;
                border-radius: 10px;
            }

            h1 {
                color: blue;
            }

            button {
                padding: 10px 15px;
                margin: 5px;
                background-color: green;
                color: white;
                border: none;
                cursor: pointer;
            }

            input {
                padding: 10px;
                margin: 5px;
            }

            #output {
                margin-top: 20px;
                text-align: left;
                background-color: #eeeeee;
                padding: 15px;
                border-radius: 8px;
                min-height: 100px;
            }
        </style>
    </head>

    <body>
        <div class="box">
            <h1 id="title">JavaScript Full Demo</h1>

            <p id="message">HTML + CSS + JavaScript</p>

            <input type="text" id="studentName" placeholder="Enter student name" />
            <input type="number" id="studentMark" placeholder="Enter mark" />

            <br />

            <button onclick="changeText()">Change Text</button>
            <button onclick="changeColor()">Change Color</button>
            <button onclick="checkResult()">Check Result</button>
            <button onclick="showStudentsForLoop()">For Loop</button>
            <button onclick="showStudentsWhileLoop()">While Loop</button>
            <button onclick="showOOP()">Class & Object</button>
            <button onclick="showInheritance()">Inheritance</button>
            <button onclick="clearOutput()">Clear</button>

            <div id="output"></div>
        </div>

        <script>
            // Array
            let students = ["Arun", "Kavin", "Santhosh", "Vijay"];
            let marks = [90, 20, 67, 45];

            // Function
            function printOutput(data) {
                document.getElementById("output").innerHTML = data;
            }

            function changeText() {
                document.getElementById("title").innerHTML = "JavaScript is Working";
            }

            function changeColor() {
                document.getElementById("title").style.color = "red";
            }

            // If Else
            function checkResult() {
                let name = document.getElementById("studentName").value;
                let mark = Number(document.getElementById("studentMark").value);

                let result = "";

                if (mark >= 35) {
                    result = name + " is Pass";
                } else {
                    result = name + " is Fail";
                }

                printOutput(result);
            }

            // For Loop
            function showStudentsForLoop() {
                let result = "<h3>For Loop Output</h3>";

                for (let i = 0; i < students.length; i++) {
                    result += students[i] + " - Mark: " + marks[i] + "<br>";
                }

                printOutput(result);
            }

            // While Loop
            function showStudentsWhileLoop() {
                let result = "<h3>While Loop Output</h3>";

                let i = 0;

                while (i < students.length) {
                    result += students[i] + " - Mark: " + marks[i] + "<br>";
                    i++;
                }

                printOutput(result);
            }

            // Class and Object
            class Student {
                constructor(name, mark) {
                    this.name = name;
                    this.mark = mark;
                }

                result() {
                    if (this.mark >= 35) {
                        return "Pass";
                    } else {
                        return "Fail";
                    }
                }

                details() {
                    return this.name + " scored " + this.mark + " and result is " + this.result();
                }
            }

            function showOOP() {
                let s1 = new Student("Santhosh", 90);
                let s2 = new Student("Arun", 20);

                let result = "<h3>Class and Object</h3>";

                result += s1.details() + "<br>";
                result += s2.details() + "<br>";

                printOutput(result);
            }

            // Inheritance
            class Department {
                constructor(studentName) {
                    this.studentName = studentName;
                }

                details() {
                    return "Student Details";
                }
            }

            class CSE extends Department {
                details() {
                    return this.studentName + " belongs to CSE Department";
                }
            }

            class IT extends Department {
                details() {
                    return this.studentName + " belongs to IT Department";
                }
            }

            function showInheritance() {
                let s1 = new CSE("Santhosh");
                let s2 = new IT("Kavin");

                let result = "<h3>Inheritance Output</h3>";

                result += s1.details() + "<br>";
                result += s2.details() + "<br>";

                printOutput(result);
            }

            function clearOutput() {
                document.getElementById("output").innerHTML = "";
            }
        </script>
    </body>
</html>
