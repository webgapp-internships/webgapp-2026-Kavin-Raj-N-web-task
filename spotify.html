<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify</title>
    <link rel="stylesheet" href="spotify.css" />
  </head>
  <body>
    <div class="main">
      <div class="nav-bar">
        <a href="spotify.html" class="spotify-a"
          ><img src="spotify.png" alt="spotify-logo" class="spotify-logo"
        /></a>
        <div class="search">
          <button class="home_button">
            <img src="home.png" alt="home-icon" class="home_img" />
          </button>
          <input
            type="search"
            class="search_input"
            placeholder="What do you want to play?"
          />
        </div>

        <div class="user">
          <button class="explore">Explore Premium</button>
          <button class="install">Install App</button>
        </div>
      </div>

      <div class="seperator"><div class="split_screen">
        <div class="your-library"><p>your-library</p></div>
        <div class="catalog"><p>catalog</p></div>
        <div class="info"><p>info</p></div>
      </div>

      <div class="player">
        <p>player</p>
      </div></div>
      
    </div>
  </body>
</html>
