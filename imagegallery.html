<!doctype html>
<html lang="en" style="font-family: Arial, Helvetica, sans-serif">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="style" href="style.css" />
  </head>
  <style>
    html {
      background-color: rgb(237, 237, 237);
      width: auto;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        Cantarell,
        "Open Sans",
        "Helvetica Neue",
        sans-serif;
    }
    h1 {
      font-size: 50px;
      padding-left: 50px;
    }
    .main {
      display: flex;
      padding-left: 40px;
    }
    .sub {
      display: flex;
      padding-left: 40px;
    }
    .car {
      background-color: white;
      margin-right: 20px;
    }
    .landscape {
      background-color: white;
      margin-right: 20px;
    }
    .aurora {
      background-color: white;
      margin-right: 20px;
    }
    .butterfly {
      background-color: white;
      margin-right: 20px;
    }
    .flower {
      background-color: white;
      margin-right: 20px;
    }
    .galaxy {
      background-color: white;
      margin-right: 20px;
    }
  </style>
  <body>
    <h1>Image Gallery</h1>
    <div class="main">
      <div class="car">
        <img
          src="https://www.kia.com/content/dam/kwcms/gt/en/images/discover-kia/voice-search/parts-80-1.jpg"
          alt="car"
          width="400"
          height="300"
        />
        <p style="padding-left: 10px">Car</p>
      </div>
      <div class="landscape">
        <img
          src="https://thumbs.dreamstime.com/b/idyllic-summer-landscape-clear-mountain-lake-alps-45054687.jpg"
          alt="landscape"
          width="400"
          height="300"
        />
        <p style="padding-left: 10px">Landscape</p>
      </div>
      <div class="aurora">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Aurora_borealis_over_Eielson_Air_Force_Base%2C_Alaska.jpg"
          alt="aurora"
          width="400"
          height="300"
        />
        <p style="padding-left: 10px">Aurora</p>
      </div>
    </div>
    <div class="sub">
      <div class="butterfly">
        <img
          src="https://img.magnific.com/free-photo/closeup-shot-beautiful-butterfly-with-interesting-textures-orange-petaled-flower_181624-7640.jpg?semt=ais_hybrid&w=740&q=80"
          alt="car"
          width="400"
          height="300"
        />
        <p style="padding-left: 10px">Butterfly</p>
      </div>
      <div class="flower">
        <img
          src="https://cdn.pixabay.com/photo/2021/01/29/06/28/marguerite-5959944_1280.jpg"
          alt="landscape"
          width="400"
          height="300"
        />
        <p style="padding-left: 10px">Flower</p>
      </div>
      <div class="galaxy">
        <img
          src="https://w0.peakpx.com/wallpaper/945/621/HD-wallpaper-gallaxy-star-universe.jpg"
          alt="galaxy"
          width="400"
          height="300"
        />
        <p style="padding-left: 10px">Galaxy</p>
      </div>
    </div>
  </body>
</html>
